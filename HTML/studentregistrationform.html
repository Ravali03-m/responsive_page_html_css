<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Form</h1>  
    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name" required ><br>
        <label>Phone Number:</label>
        <input type="tel" placeholder="enter your contact number" required/><br> 
        <label>Email:</label>
        <input type="email" placeholder="Enter your email" required><br>
        <label>Password:</label>
        <input type="password" placeholder="Enter your password" required><br>
        <label>Gender:</label><br>
        <input type="radio" value="male"/>
        <label>Male</label><br>
        <input type="radio" value="female"/>
        <label>Female</label><br>
        <label>skills</label><br>
        <input type="checkbox" value="coding"/>
        <label>Coding</label><br>
        <input type="checkbox" value="design"/>
        <label>Design</label><br>
        <label>Country:</label><br>
        <select>
            <option value="EEE">EEE</option>
            <option value="IT">IT</option>
            <option value="CSE">CSE</option>
        </select><br>
        <label>Address:</label><br>
        <textarea placeholder="Enter your address" rows="4" cols="58"></textarea><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
